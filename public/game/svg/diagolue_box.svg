<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="100%" height="100%">
  <defs>
    <!-- Halftone pattern for a subtle retro comic texture -->
    <pattern id="halftone" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#f1f5f9" />
    </pattern>
  </defs>

  <!-- Comic Drop Shadow (Offset for retro depth) -->
  <path d="M 70 50
           H 350
           A 30 30 0 0 1 380 80
           V 170
           A 30 30 0 0 1 350 200
           H 170
           Q 150 260 90 280
           Q 130 230 130 200
           H 70
           A 30 30 0 0 1 40 170
           V 80
           A 30 30 0 0 1 70 50 Z" 
        fill="#0f172a" 
        transform="translate(15, 15)" />

  <!-- Main Speech Bubble Body -->
  <path d="M 70 50
           H 350
           A 30 30 0 0 1 380 80
           V 170
           A 30 30 0 0 1 350 200
           H 170
           Q 150 260 90 280
           Q 130 230 130 200
           H 70
           A 30 30 0 0 1 40 170
           V 80
           A 30 30 0 0 1 70 50 Z" 
        fill="#ffffff" 
        stroke="#0f172a" 
        stroke-width="10" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- Inner Halftone Texture Overlay -->
  <path d="M 70 50
           H 350
           A 30 30 0 0 1 380 80
           V 170
           A 30 30 0 0 1 350 200
           H 170
           Q 150 260 90 280
           Q 130 230 130 200
           H 70
           A 30 30 0 0 1 40 170
           V 80
           A 30 30 0 0 1 70 50 Z" 
        fill="url(#halftone)" 
        pointer-events="none" />

  <!-- Comic Highlight Curve -->
  <path d="M 55 100 
           A 35 35 0 0 1 90 65 
           H 330" 
        fill="none" 
        stroke="#cbd5e1" 
        stroke-width="5" 
        stroke-linecap="round" />
</svg>
