<svg viewBox="0 0 300 500" width="100%" height="100%">
  <!-- Drop Shadow (Cartoon style) -->
  <rect x="26" y="26" width="260" height="460" rx="20" fill="#94A3B8" />
  
  <!-- Main Machine Body -->
  <rect x="20" y="20" width="260" height="460" rx="20" fill="#F8FAFC" stroke="#1E293B" stroke-width="6" />

  <!-- Top Header Section -->
  <text x="40" y="48" font-family="&#39;Fredoka&#39;, &#39;Comic Sans MS&#39;, sans-serif" font-weight="bold" font-size="16" fill="#1E293B">BALLOT UNIT</text>
  
  <!-- Ready Light (Green) -->
  <circle cx="245" cy="42" r="8" fill="#22C55E" stroke="#1E293B" stroke-width="3" />
  <circle cx="243" cy="40" r="3" fill="#FFF" opacity="0.6" /> <!-- Shine effect -->

  <!-- Inner Display Panel Background -->
  <rect x="35" y="65" width="230" height="380" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="5" />

  <!-- ================= ROW 1 (Candidate A) ================= -->
  <!-- Candidate/Symbol Box -->
  <rect x="45" y="75" width="100" height="50" rx="5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" />
  <!-- Mock Party Symbol (Sun) -->
  <circle cx="65" cy="100" r="10" fill="#FBBF24" stroke="#1E293B" stroke-width="2" /> 
  <!-- Mock Candidate Name -->
  <rect x="85" y="96" width="50" height="8" rx="4" fill="#94A3B8" /> 
  
  <!-- Red LED (Off state by default) -->
  <circle id="led-1" cx="170" cy="100" r="8" fill="#94A3B8" stroke="#1E293B" stroke-width="3" />
  
  <!-- Blue Button (Interactive) -->
  <!-- Added cursor-pointer to show it's clickable -->
  <rect id="btn-1" x="195" y="85" width="55" height="30" rx="15" fill="#3B82F6" stroke="#1E293B" stroke-width="4" />
  <!-- Button Shine effect -->
  <path d="M 205 92 Q 220 88 235 92" stroke="#93C5FD" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- Row Divider -->
  <line x1="35" y1="135" x2="265" y2="135" stroke="#1E293B" stroke-width="4" />

  <!-- ================= ROW 2 (Candidate B) ================= -->
  <rect x="45" y="145" width="100" height="50" rx="5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" />
  <!-- Mock Party Symbol (Leaf) -->
  <polygon points="65,160 75,178 55,178" fill="#22C55E" stroke="#1E293B" stroke-width="2" />
  <rect x="85" y="166" width="40" height="8" rx="4" fill="#94A3B8" />
  
  <circle id="led-2" cx="170" cy="170" r="8" fill="#94A3B8" stroke="#1E293B" stroke-width="3" />
  <rect id="btn-2" x="195" y="155" width="55" height="30" rx="15" fill="#3B82F6" stroke="#1E293B" stroke-width="4" />
  <path d="M 205 162 Q 220 158 235 162" stroke="#93C5FD" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <line x1="35" y1="205" x2="265" y2="205" stroke="#1E293B" stroke-width="4" />

  <!-- ================= ROW 3 (Candidate C) ================= -->
  <rect x="45" y="215" width="100" height="50" rx="5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" />
  <!-- Mock Party Symbol (Box) -->
  <rect x="55" y="230" width="20" height="20" rx="4" fill="#A855F7" stroke="#1E293B" stroke-width="2" />
  <rect x="85" y="236" width="45" height="8" rx="4" fill="#94A3B8" />
  
  <circle id="led-3" cx="170" cy="240" r="8" fill="#94A3B8" stroke="#1E293B" stroke-width="3" />
  <rect id="btn-3" x="195" y="225" width="55" height="30" rx="15" fill="#3B82F6" stroke="#1E293B" stroke-width="4" />
  <path d="M 205 232 Q 220 228 235 232" stroke="#93C5FD" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <line x1="35" y1="275" x2="265" y2="275" stroke="#1E293B" stroke-width="4" />

  <!-- ================= ROW 4 (Candidate D) ================= -->
  <rect x="45" y="285" width="100" height="50" rx="5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" />
  <!-- Mock Party Symbol (Wheel) -->
  <circle cx="65" cy="310" r="9" fill="#EC4899" stroke="#1E293B" stroke-width="2" />
  <circle cx="65" cy="310" r="3" fill="#FFF" />
  <rect x="85" y="306" width="50" height="8" rx="4" fill="#94A3B8" />
  
  <circle id="led-4" cx="170" cy="310" r="8" fill="#94A3B8" stroke="#1E293B" stroke-width="3" />
  <rect id="btn-4" x="195" y="295" width="55" height="30" rx="15" fill="#3B82F6" stroke="#1E293B" stroke-width="4" />
  <path d="M 205 302 Q 220 298 235 302" stroke="#93C5FD" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <line x1="35" y1="345" x2="265" y2="345" stroke="#1E293B" stroke-width="4" />

  <!-- ================= ROW 5 (NOTA) ================= -->
  <!-- Using a pink/red tint to highlight NOTA distinctively for gameplay -->
  <rect x="45" y="355" width="100" height="50" rx="5" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" />
  <text x="75" y="386" font-family="&#39;Fredoka&#39;, &#39;Comic Sans MS&#39;, sans-serif" font-weight="bold" font-size="16" fill="#EF4444">NOTA</text>
  
  <circle id="led-5" cx="170" cy="380" r="8" fill="#94A3B8" stroke="#1E293B" stroke-width="3" />
  <rect id="btn-5" x="195" y="365" width="55" height="30" rx="15" fill="#3B82F6" stroke="#1E293B" stroke-width="4" />
  <path d="M 205 372 Q 220 368 235 372" stroke="#93C5FD" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Bottom Panel Base (Braille/Text area mock) -->
  <rect x="80" y="415" width="140" height="15" rx="7" fill="#CBD5E1" />
</svg>